<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RiskPilot</title>
  <meta name="description" content="RiskPilot legal and support pages." />
  <style>
    :root {
      --bg: #070b14;
      --card: #0d1221;
      --border: #1e2d45;
      --text: #f0f4ff;
      --muted: #8fa3c0;
      --accent: #00d4aa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-top: 20px;
    }
    h1, h2 { margin: 0 0 12px; }
    p { color: var(--muted); }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }
    .links a {
      display: inline-block;
      margin-right: 16px;
      margin-top: 10px;
    }
    .brand {
      letter-spacing: 0.3em;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">RISKPILOT</div>
    <h1>RiskPilot Legal & Support</h1>
    <p>
      This site contains the public privacy and account support pages for RiskPilot.
    </p>

    <div class="card">
      <h2>Pages</h2>
      <div class="links">
        <a href="./privacy/">Privacy Policy</a>
        <a href="./delete-account/">Account Deletion</a>
      </div>
    </div>
  </div>
</body>
</html>
